<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F0C20"/>
      <stop offset="45%" stop-color="#1E1B4B"/>
      <stop offset="80%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="23" y1="23" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8E7CFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glassSurface" x1="23" y1="23" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="cShadow" x="15" y="15" width="80" height="80" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8E7CFF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- iOS-style Squircle background -->
  <rect x="0" y="0" width="108" height="108" rx="24" fill="url(#bgGrad)"/>

  <!-- Frosted glass card -->
  <rect x="23" y="23" width="62" height="62" rx="14" fill="url(#glassSurface)" stroke="url(#glassBorder)" stroke-width="1.5"/>

  <!-- Top highlight reflection -->
  <path d="M 37 23.8 L 71 23.8 C 78.5 23.8 84.2 29.5 84.2 37" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Thick Glass C -->
  <path d="M 64 41 A 18 18 0 1 0 64 67" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#cShadow)"/>
  <path d="M 64 41 A 18 18 0 1 0 64 67" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Top Curve Specular Gloss Reflection -->
  <path d="M 34 50 A 18 18 0 0 1 55 36" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Calculator Dot inside opening -->
  <circle cx="70" cy="54" r="4.8" fill="#8E7CFF" fill-opacity="0.4"/>
  <circle cx="70" cy="54" r="3.2" fill="#8E7CFF"/>
  <circle cx="69" cy="53" r="1.1" fill="#FFFFFF"/>
</svg>
