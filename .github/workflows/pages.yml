name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web App
        run: |
          mkdir -p dist
          cp -r public/* dist/ 2>/dev/null || true
          cp -r docs dist/ 2>/dev/null || true
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gcalc - Glass Scientific & Engineering Calculator</title>
            <link rel="icon" type="image/svg+xml" href="favicon.svg">
            <style>
              body {
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
                color: #f8fafc;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px;
                text-align: center;
              }
              .card {
                background: rgba(255, 255, 255, 0.08);
                backdrop-filter: blur(24px);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 24px;
                padding: 40px;
                max-width: 520px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.4);
              }
              h1 { font-size: 2.5rem; margin: 16px 0 8px 0; }
              p { color: #94a3b8; line-height: 1.6; }
              .btn {
                display: inline-block;
                margin-top: 24px;
                padding: 14px 28px;
                background: #6366f1;
                color: white;
                text-decoration: none;
                border-radius: 14px;
                font-weight: 600;
                transition: transform 0.2s;
              }
              .btn:hover { transform: scale(1.05); }
            </style>
          </head>
          <body>
            <div class="card">
              <img src="favicon.svg" width="96" height="96" alt="Gcalc Logo" />
              <h1>Gcalc</h1>
              <p>A precision glass-morphic scientific and engineering calculator featuring notebook math notation, stacked fractions, and a full engineering tool suite.</p>
              <a href="https://github.com/krishkumarcodes/Gcalc/releases" class="btn">Download Latest APK</a>
            </div>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
